<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中东第一手情报工作台</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#161a20; --muted:#6b7280;
  --border:#e3e7ed; --accent:#1d4ed8; --accent-soft:#eef2ff;
  --lv1:#dc2626; --lv2:#ea580c; --lv3:#d97706; --lv4:#059669;
  --up:#d92e2e; --down:#0f9b5a; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:18px}
.wrap{max-width:1560px;margin:0 auto}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,Consolas,monospace}

/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;font-weight:700;letter-spacing:.3px}
h1 span{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
.updated{color:var(--muted);font-size:12.5px}
.btn{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:6px 13px;cursor:pointer;font-size:12.5px;color:var(--text)}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* risk panel */
.risk{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);
  display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.gauge{flex:0 0 128px;text-align:center}
.gauge .num{font-size:46px;font-weight:800;line-height:1}
.gauge .lv{display:inline-block;margin-top:7px;padding:3px 14px;border-radius:20px;color:#fff;font-size:12.5px;font-weight:700}
.gauge .trend{font-size:12px;color:var(--muted);margin-top:6px}
.risk .txt{flex:1;min-width:280px;font-size:13.5px;line-height:1.85}
.risk .txt b{color:var(--accent)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.m{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.m .n{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.m .v{font-size:19px;font-weight:700}
.m .c{font-size:12px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

/* layout */
.grid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media(max-width:1080px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ph{padding:11px 15px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}

/* filters */
.filters{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.tab{padding:5px 12px;border-radius:16px;border:1px solid var(--border);cursor:pointer;font-size:12.5px;background:#fff}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .c{font-size:11px;opacity:.75;margin-left:4px}
input.search{flex:1;min-width:150px;padding:6px 11px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;outline:none}
input.search:focus{border-color:var(--accent)}
select{padding:6px 9px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:#fff}

/* list */
.list{max-height:calc(100vh - 120px);overflow-y:auto}
.item{padding:12px 15px;border-bottom:1px solid #f1f3f7;display:flex;gap:12px}
.item:hover{background:#fafbfd}
.badge{flex:0 0 46px;height:24px;border-radius:6px;color:#fff;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.body{flex:1;min-width:0}
.t{font-size:14px;font-weight:600;line-height:1.5;word-break:break-word}
.t.zh{font-weight:400;color:#334155;font-size:13px;margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--muted);align-items:center}
.tag{background:#f1f5f9;border-radius:5px;padding:1px 7px;color:#475569}
.tag.e{background:#eef2ff;color:#3730a3}
.tag.k{background:#fef3c7;color:#92400e}
.src{font-weight:600;color:#334155}
.new{background:var(--lv1);color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:700}

/* side */
.side{display:flex;flex-direction:column;gap:14px}
.bar{height:7px;background:#f1f3f7;border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px}
.pb{padding:11px 15px}
.pb .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.ent{display:flex;flex-wrap:wrap;gap:6px;padding:12px 15px}
.ent span{background:#eef2ff;color:#3730a3;border-radius:5px;padding:2px 8px;font-size:12px}
.srclist{padding:10px 15px;font-size:12px;color:var(--muted);line-height:1.9}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.sensor{padding:12px 15px;font-size:12.5px;line-height:1.9}
.sensor b{color:var(--accent)}
footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>中东第一手情报工作台<span>Middle East First-Hand Intelligence Desk</span></h1>
  <div class="updated" id="upd">—</div>
  <button class="btn" id="auto">自动刷新：关</button>
  <button class="btn" onclick="reload(true)">立即刷新</button>
</header>

<div class="risk">
  <div class="gauge">
    <div class="num" id="score">—</div>
    <div class="lv" id="level">—</div>
    <div class="trend" id="trend">—</div>
  </div>
  <div class="txt" id="summary">加载中...</div>
</div>

<div class="metrics" id="metrics"></div>

<div class="grid">
  <div class="panel">
    <div class="ph">
      <span id="cnt">情报流</span>
      <span class="updated" id="cnt2"></span>
    </div>
    <div class="filters">
      <div class="tab on" data-d="all">全部</div>
      <div class="tab" data-d="conflict">地缘冲突</div>
      <div class="tab" data-d="energy">能源油价</div>
      <div class="tab" data-d="shipping">航运物流</div>
      <div class="tab" data-d="finance">金融市场</div>
      <select id="lv"><option value="">全部等级</option><option value="极高">极高</option>
        <option value="高">高</option><option value="中">中</option><option value="低">低</option></select>
      <select id="sort"><option value="risk">按风险排序</option><option value="time">按时间排序</option></select>
      <input class="search" id="q" placeholder="搜索标题 / 来源 / 实体关键词...">
    </div>
    <div class="list" id="list"><div class="empty">加载中...</div></div>
  </div>

  <div class="side">
    <div class="panel" id="sensorPanel" style="display:none">
      <div class="ph">实时传感</div>
      <div class="sensor" id="sensor"></div>
    </div>
    <div class="panel">
      <div class="ph">领域分布</div>
      <div class="pb" id="doms"></div>
    </div>
    <div class="panel">
      <div class="ph">高频主体</div>
      <div class="ent" id="ents"></div>
    </div>
    <div class="panel">
      <div class="ph">信源状态</div>
      <div class="srclist" id="srcs"></div>
    </div>
  </div>
</div>

<footer id="footer">—</footer>
</div>

<script>
var D = window.__ME_DATA__ || null;
var F = {d:'all', lv:'', sort:'risk', q:''};
var LVC = {'极高':'--lv1','高':'--lv2','中':'--lv3','低':'--lv4'};
var LVH = {'极高':'#dc2626','高':'#ea580c','中':'#d97706','低':'#059669'};
var DOMN = {conflict:'地缘冲突',energy:'能源油价',shipping:'航运物流',finance:'金融市场'};

function esc(s){return (s||'').replace(/[&<>"]/g,c=>{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}
function ago(iso){
  var t=new Date(iso), m=(Date.now()-t.getTime())/60000;
  if(m<1)return '刚刚'; if(m<60)return Math.floor(m)+' 分钟前';
  var h=m/60; if(h<24)return Math.floor(h)+' 小时前';
  return Math.floor(h/24)+' 天前';
}
function chgCls(v){return v>0?'up':(v<0?'down':'flat');}
function chgTxt(v){return (v>0?'+':'')+v+'%';}

async function reload(btn){
  if(btn){document.getElementById('upd').textContent='刷新中...';}
  try{
    var r = await fetch('data/latest.json?t='+Date.now());
    if(r.ok){ D = await r.json(); }
  }catch(e){}
  render();
}

function render(){
  if(!D){document.getElementById('summary').textContent='未找到数据，请先运行 collector.py';return;}
  var R = D.risk||{};

  // header
  document.getElementById('upd').textContent='更新于 '+D.updated;
  var sc=Math.round(R.score||0);
  document.getElementById('score').textContent=sc;
  var lvEl=document.getElementById('level');
  lvEl.textContent=R.level||'—';
  lvEl.style.background=LVH[R.level]||'#6b7280';
  document.getElementById('score').style.color=LVH[R.level]||'#6b7280';
  document.getElementById('trend').textContent='趋势 '+(R.trend||'—');
  document.getElementById('summary').textContent=R.summary||'';

  // metrics
  var M=D.markets||{}, h='';
  (M.futures||[]).forEach(function(f){
    h+='<div class="m"><div class="n">'+esc(f.name)+'</div><div class="v">'+f.price+
       '</div><div class="c '+chgCls(f.chg)+'">'+chgTxt(f.chg)+'</div>'+
       (f.unit?'<div class="n" style="margin-top:3px">'+esc(f.unit)+'</div>':'')+'</div>';
  });
  var fx=(M.fx||{}).rates||{};
  var fxk=Object.keys(fx).slice(0,4);
  if(fxk.length){
    h+='<div class="m"><div class="n">汇率 USD</div><div class="v" style="font-size:13px">'+
       fxk.map(k=>k+' '+fx[k]).join('<br>')+'</div></div>';
  }
  var q=D.quakes||[];
  h+='<div class="m"><div class="n">中东地震监测</div><div class="v">'+q.length+
     '</div><div class="c flat">最强 '+(q[0]?q[0].mag:0)+' 级</div></div>';
  var S=D.sensors||{};
  if(S.firms) h+='<div class="m"><div class="n">卫星火点</div><div class="v">'+S.firms.count+
     '</div><div class="c '+(S.firms.alerts.length?'up':'flat')+'">'+(S.firms.alerts.length||0)+' 处告警</div></div>';
  if(S.air) h+='<div class="m"><div class="n">中东空域航班</div><div class="v">'+S.air.total+
     '</div><div class="c '+(S.air.military_count?'up':'flat')+'">军机 '+S.air.military_count+'</div></div>';
  if(S.eia) h+='<div class="m"><div class="n">EIA 布伦特官方</div><div class="v">'+S.eia.price+
     '</div><div class="c '+chgCls(S.eia.chg)+'">'+chgTxt(S.eia.chg)+'</div></div>';
  document.getElementById('metrics').innerHTML=h;

  // sensors
  var sp='';
  if(S.air){sp+='<div>空域：在册 <b>'+S.air.total+'</b> 架，空中 <b>'+S.air.airborne+
    '</b> 架，军用呼号 <b>'+S.air.military_count+'</b> 架</div>';
    if(S.air.emergency&&S.air.emergency.length) sp+='<div>紧急应答机（7500/7600/7700）：<b>'+S.air.emergency.length+'</b> 架</div>';}
  if(S.firms){sp+='<div>卫星火点 <b>'+S.firms.count+'</b> 处，重点设施告警 <b>'+S.firms.alerts.length+'</b> 处</div>';}
  if(S.ais){sp+='<div>AIS 船舶 <b>'+S.ais.total+'</b> 艘，油轮 <b>'+S.ais.tankers+'</b> 艘</div>';}
  if(sp){document.getElementById('sensorPanel').style.display='';document.getElementById('sensor').innerHTML=sp;}

  // domains
  var dm=D.domains||{}, tot=0; for(var k in dm) tot+=dm[k];
  var dh='';
  ['conflict','energy','shipping','finance'].forEach(function(k){
    var v=dm[k]||0, p=tot?Math.round(v/tot*100):0;
    dh+='<div class="pb" style="padding:7px 15px"><div class="row"><span>'+DOMN[k]+
        '</span><span>'+v+' 条</span></div><div class="bar"><i style="width:'+p+'%;background:'+
        ({conflict:'#dc2626',energy:'#ea580c',shipping:'#1d4ed8',finance:'#059669'}[k])+'"></i></div></div>';
  });
  document.getElementById('doms').innerHTML=dh;

  // entities
  document.getElementById('ents').innerHTML=(D.entities||[]).map(e=>'<span>'+esc(e)+'</span>').join('')||'<span style="color:#94a3b8">—</span>';

  // sources
  var st=D.stats||{};
  var sh='<div><span class="dot" style="background:#059669"></span>接入成功 '+(st.src_ok||[]).length+' 个</div>';
  if((st.src_fail||[]).length) sh+='<div><span class="dot" style="background:#dc2626"></span>未通 '+(st.src_fail||[]).length+' 个：'+esc((st.src_fail||[]).join('、'))+'</div>';
  if(st.proxy) sh+='<div style="margin-top:6px">代理：'+esc(st.proxy)+'</div>';
  sh+='<div style="margin-top:6px">本轮耗时 '+(st.elapsed||0)+'s，过滤噪声 '+(st.dropped||0)+' 条</div>';
  document.getElementById('srcs').innerHTML=sh;

  // list
  var items=(D.items||[]).slice();
  if(F.d!=='all') items=items.filter(i=>(i.domains||[]).indexOf(F.d)>=0);
  if(F.lv) items=items.filter(i=>i.level===F.lv);
  if(F.q){
    var q=F.q.toLowerCase();
    items=items.filter(i=>((i.title||'')+(i.title_zh||'')+(i.source||'')+
      JSON.stringify(i.entities||{})).toLowerCase().indexOf(q)>=0);
  }
  if(F.sort==='time') items.sort((a,b)=>b.ts_raw-a.ts_raw);
  else items.sort((a,b)=>b.risk-a.risk);

  document.getElementById('cnt').textContent='情报流 · '+items.length+' 条';
  document.getElementById('cnt2').textContent='新增 '+(st.new||0)+' 条 / 共 '+(st.total||0)+' 条';

  if(!items.length){document.getElementById('list').innerHTML='<div class="empty">无匹配结果</div>';return;}
  var lh='';
  items.slice(0,200).forEach(function(i){
    var ents=[]; ['countries','orgs','places'].forEach(function(c){
      (i.entities&&i.entities[c]||[]).forEach(e=>{if(ents.length<5)ents.push(e);});
    });
    lh+='<div class="item">'+
      '<div class="badge" style="background:'+(LVH[i.level]||'#6b7280')+'">'+i.risk+'</div>'+
      '<div class="body">'+
        '<div class="t" dir="auto"><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.title)+'</a></div>'+
        (i.title_zh?'<div class="t zh" dir="auto">中译：'+esc(i.title_zh)+'</div>':'')+
        '<div class="meta">'+
          '<span class="src">'+esc(i.source)+'</span>'+
          '<span>'+ago(i.ts)+'</span>'+
          (i.is_new?'<span class="new">NEW</span>':'')+
          (i.domains||[]).map(d=>'<span class="tag">'+DOMN[d]+'</span>').join('')+
          ents.map(e=>'<span class="tag e">'+esc(e)+'</span>').join('')+
          (i.keywords||[]).slice(0,3).map(k=>'<span class="tag k">'+esc(k)+'</span>').join('')+
          '<span class="tag">'+i.lang.toUpperCase()+'</span>'+
        '</div>'+
      '</div></div>';
  });
  document.getElementById('list').innerHTML=lh;

  document.getElementById('footer').textContent='数据每 30 分钟自动更新 · 共 '+
    (st.total||0)+' 条 · 本地存储于 data/latest.json';
}

// events
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); F.d=t.dataset.d; render();
  };
});
document.getElementById('lv').onchange=e=>{F.lv=e.target.value;render();};
document.getElementById('sort').onchange=e=>{F.sort=e.target.value;render();};
var tm; document.getElementById('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{F.q=e.target.value;render();},220);};
var autoInt=null;
document.getElementById('auto').onclick=function(){
  if(autoInt){clearInterval(autoInt);autoInt=null;this.textContent='自动刷新：关';this.classList.remove('on');}
  else{autoInt=setInterval(()=>reload(),60000);this.textContent='自动刷新：开';this.classList.add('on');}
};

render();
if(location.protocol!=='file:') setInterval(()=>reload(),300000);
</script>
</body>
</html>
